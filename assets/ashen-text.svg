<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <style>
    text { font-family: 'Cinzel', 'Trajan Pro', Georgia, 'Times New Roman', serif; opacity: 0; }

    @keyframes fade {
      0%   { opacity: 0; }
      15%  { opacity: 1; }
      60%  { opacity: 1; }
      80%  { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes fromLeft {
      0%   { opacity: 0; transform: translateX(-60px); }
      15%  { opacity: 1; transform: translateX(0); }
      60%  { opacity: 1; transform: translateX(0); }
      80%  { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; }
    }
    @keyframes fromRight {
      0%   { opacity: 0; transform: translateX(60px); }
      15%  { opacity: 1; transform: translateX(0); }
      60%  { opacity: 1; transform: translateX(0); }
      80%  { opacity: 0; transform: translateX(0); }
      100% { opacity: 0; }
    }

    .back  { font-size: 100px; fill: #4a0000; letter-spacing: 12px; animation: fade 10s infinite; }
    .l1    { font-size: 20px;  fill: #b30000; letter-spacing: 2px; animation: fromLeft 10s infinite;  animation-delay: 0.5s; }
    .l2    { font-size: 24px;  fill: #ff1a1a; letter-spacing: 2px; animation: fromRight 10s infinite; animation-delay: 1.5s; }
    .l3    { font-size: 22px;  fill: #8b0000; letter-spacing: 2px; animation: fromLeft 10s infinite;  animation-delay: 2.5s; }
    .front { font-size: 56px;  fill: #ff0000; letter-spacing: 8px; animation: fade 10s infinite;      animation-delay: 3.5s; }
    .full  { font-size: 22px;  fill: #d10000; letter-spacing: 2px; animation: fade 10s infinite;      animation-delay: 4.5s; }
  </style>

  <!-- camada de fundo -->
  <text class="back" x="400" y="190" text-anchor="middle">VINICIUS</text>

  <!-- camadas laterais -->
  <text class="l1" x="20"  y="50"  text-anchor="start">Rise, if you would...</text>
  <text class="l2" x="780" y="110" text-anchor="end">Undead</text>
  <text class="l3" x="40"  y="260" text-anchor="start"> That is our curse...</text>

  <!-- camada da frente -->
  <text class="front" x="400" y="180" text-anchor="middle">VINICIUS</text>
  <text class="full"  x="400" y="300" text-anchor="middle">Cursando Cybersecurity na FIAP com foco em SOC!</text>
</svg>
